name: build-binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: darwin-arm64
            runner: macos-14
            platform: darwin
          - name: darwin-x64
            runner: macos-15-intel
            platform: darwin
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux
          - name: windows-x64
            runner: windows-2025
            platform: win32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build prebuilt native addon
        run: pnpm prebuild

      - name: Run tests
        run: pnpm test

      - name: Strip native binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v strip >/dev/null 2>&1; then
            strip -x prebuilds/${{ matrix.target.platform }}-*/*.node || true
          fi

      - name: Install Linux UPX
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Compress Linux native binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          binaries=(prebuilds/linux-*/*.node)
          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "No Linux native binaries found"
            exit 1
          fi
          upx --best --lzma "${binaries[@]}"

      - name: Install UPX
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install upx -y

      - name: Compress Windows native binary
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -Path prebuilds -Recurse -Filter *.node | ForEach-Object {
            upx --best --lzma $_.FullName
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.name }}
          path: prebuilds
          if-no-files-found: error
          retention-days: 7

      - name: Package release asset
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -czf release-assets/${{ matrix.target.name }}.tar.gz -C prebuilds ${{ matrix.target.platform }}-*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

  publish:
    name: Publish npm package
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download prebuilds
        uses: actions/download-artifact@v6
        with:
          pattern: '*'
          path: downloaded-prebuilds
          merge-multiple: true

      - name: Prepare prebuilds for npm package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilds
          mkdir -p prebuilds
          find downloaded-prebuilds -mindepth 2 -maxdepth 2 -type d -exec cp -R {} prebuilds/ \;
          find prebuilds -maxdepth 2 -type f -name '*.node' -print | sort
          test "$(find prebuilds -maxdepth 2 -type f -name '*.node' | wc -l | tr -d ' ')" -ge 4

      - name: Build TypeScript entry
        run: pnpm build:ts

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
